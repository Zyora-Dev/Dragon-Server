name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.89.0 clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.89.0 test --locked